# Refresh ESPN data, build the Astro site, and deploy to GitHub Pages.
# Triggers: push to main/master, a weekly Wednesday cron, or manual dispatch.
name: Build and Deploy

on:
  push:
    branches: [main, master]
  schedule:
    # Wednesdays 14:00 UTC (~9-10am ET, after Monday Night Football wraps the week).
    - cron: "0 14 * * 3"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  # write so the scheduled run can commit refreshed data back — keeps the repo
  # active (GitHub disables schedules after 60 days idle) and versions the JSON.
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Node 24-based majors; GitHub drops Node 20 from runners 2026-09-16.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch league data
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '14250' }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python scripts/fetch_data.py

      # Commit the refreshed JSON on scheduled/manual runs (not on push, to avoid a
      # loop). A GITHUB_TOKEN commit doesn't re-trigger workflows, so this is safe and
      # the weekly commit resets the 60-day scheduled-workflow idle timer.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Weekly data refresh [skip ci]"
            git push
          fi

      - name: Install Node deps
        run: npm ci || npm install

      - name: Build site
        env:
          # GitHub Pages serves project sites under /<repo>/. Override via repo vars if needed.
          ASTRO_SITE: ${{ vars.ASTRO_SITE || format('https://{0}.github.io', github.repository_owner) }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
